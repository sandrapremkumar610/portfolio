  <rect x="385" y="244" width="155" height="65" rx="6" fill="#041B1F" stroke="#164E63"/>
  <text x="395" y="262" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Architecture Highlights</text>
  <text x="395" y="278" font-family="sans-serif" font-size="9" fill="#94A3B8">• Django MVC & ORM</text>
