<svg width="600" height="420" viewBox="0 0 600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diet_bg" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ai_glow" x1="120" y1="80" x2="350" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FE4300" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" rx="16" fill="url(#diet_bg)"/>
  <circle cx="450" cy="120" r="160" fill="url(#ai_glow)"/>
  <circle cx="120" cy="320" r="140" fill="#FE4300" fill-opacity="0.08"/>

  <!-- Top App Bar -->
  <rect x="40" y="30" width="520" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <circle cx="62" cy="50" r="5" fill="#EF4444"/>
  <circle cx="78" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="94" cy="50" r="5" fill="#10B981"/>
  <rect x="120" y="42" width="220" height="16" rx="4" fill="#0F172A"/>
  <text x="130" y="54" font-family="sans-serif" font-size="10" fill="#94A3B8">https://aidietplan.portal/dashboard</text>
  <rect x="460" y="38" width="85" height="24" rx="12" fill="#FE4300"/>
  <text x="502" y="54" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gemini AI</text>

  <!-- Main Dashboard Card -->
  <rect x="40" y="85" width="320" height="295" rx="12" fill="url(#card_grad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- AI Status Pill -->
  <rect x="60" y="105" width="130" height="24" rx="12" fill="#FE4300" fill-opacity="0.2"/>
  <text x="125" y="121" font-family="sans-serif" font-size="11" font-weight="600" fill="#FE4300" text-anchor="middle">✦ 7-Day Smart Plan</text>

  <text x="60" y="155" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">AI Diet Plan Management</text>
  <text x="60" y="178" font-family="sans-serif" font-size="12" fill="#94A3B8">Personalized nutrition driven by Gemini AI</text>

  <!-- Metrics row -->
  <rect x="60" y="200" width="85" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="102" y="225" font-family="sans-serif" font-size="16" font-weight="700" fill="#38BDF8" text-anchor="middle">2,150</text>
  <text x="102" y="244" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">kcal / day</text>

  <rect x="155" y="200" width="85" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="197" y="225" font-family="sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">120g</text>
  <text x="197" y="244" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Protein Target</text>

  <rect x="250" y="200" width="90" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="295" y="225" font-family="sans-serif" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle">Approved</text>
  <text x="295" y="244" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Consultant Sign-off</text>

  <!-- Meal Schedule preview -->
  <rect x="60" y="275" width="280" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
  <circle cx="80" cy="296" r="10" fill="#FE4300"/>
  <text x="80" y="300" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
  <text x="100" y="293" font-family="sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Breakfast: Oats & Almond Smoothie</text>
  <text x="100" y="308" font-family="sans-serif" font-size="10" fill="#94A3B8">380 kcal · 18g Protein · Allergen Safe</text>

  <rect x="60" y="325" width="280" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
  <circle cx="80" cy="346" r="10" fill="#3B82F6"/>
  <text x="80" y="350" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="100" y="343" font-family="sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Lunch: Grilled Quinoa & Steamed Greens</text>
  <text x="100" y="358" font-family="sans-serif" font-size="10" fill="#94A3B8">520 kcal · 32g Protein · Low Carb</text>

  <!-- Right Side: AI Consultant Review Panel -->
  <rect x="375" y="85" width="185" height="295" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="395" y="115" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Consultant Review</text>
  <rect x="395" y="130" width="145" height="18" rx="4" fill="#1E293B"/>
  <text x="403" y="143" font-family="sans-serif" font-size="10" fill="#10B981">✓ Profile & Allergies Verified</text>

  <rect x="395" y="160" width="145" height="110" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="405" y="180" font-family="sans-serif" font-size="11" font-weight="600" fill="#FE4300">Gemini Prompt:</text>
  <text x="405" y="200" font-family="monospace" font-size="9" fill="#94A3B8">Generate 7-day meal</text>
  <text x="405" y="214" font-family="monospace" font-size="9" fill="#94A3B8">profile: diabetic-safe,</text>
  <text x="405" y="228" font-family="monospace" font-size="9" fill="#94A3B8">target: 2150 kcal,</text>
  <text x="405" y="242" font-family="monospace" font-size="9" fill="#94A3B8">allergies: gluten-free.</text>
  <rect x="405" y="250" width="125" height="14" rx="3" fill="#10B981" fill-opacity="0.2"/>
  <text x="467" y="261" font-family="sans-serif" font-size="8" font-weight="600" fill="#34D399" text-anchor="middle">APPROVED BY CLINICIAN</text>

  <!-- Tech tags -->
  <rect x="395" y="285" width="145" height="28" rx="6" fill="#1E293B"/>
  <text x="467" y="303" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Laravel & PHP Stack</text>

  <rect x="395" y="325" width="145" height="42" rx="6" fill="#FE4300"/>
  <text x="467" y="350" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Generate Schedule →</text>
</svg>